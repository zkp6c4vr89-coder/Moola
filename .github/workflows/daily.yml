name: daily-run

# Started daily at 21:30 UTC (after the US close; crypto-only on weekends/holidays) by the
# Cloudflare Worker in scheduler/. GitHub's own cron (3-5 hours late) stays as a BACKUP until
# the Worker has proven itself; a scheduled run skips itself if today's run is already logged.
on:
  schedule:
    - cron: "30 21 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Decide but place no orders"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: daily-run
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: pip install -e ".[dev]"

      - name: Tests (no trading if the strategy is broken)
        run: pytest -q

      - name: Run bot
        env:
          ALPACA_API_KEY: ${{ secrets.ALPACA_API_KEY }}
          ALPACA_SECRET_KEY: ${{ secrets.ALPACA_SECRET_KEY }}
        run: |
          TODAY=$(TZ=America/New_York date +%F)
          if [ "${{ github.event_name }}" = "schedule" ] && tail -n 1 logs/equity.csv 2>/dev/null | grep -q "^$TODAY,"; then
            echo "Backup cron: today's run ($TODAY) already happened via the scheduler Worker; skipping."
            exit 0
          fi
          python -m moola.run_daily ${{ inputs.dry_run && '--dry-run' || '' }}

      - name: Commit logs
        if: ${{ !inputs.dry_run }}
        run: |
          git config user.name "moola-bot"
          git config user.email "moola-bot@users.noreply.github.com"
          git add logs results_summary.md
          git diff --cached --quiet && exit 0
          git commit -m "bot: daily run $(date -u +%Y-%m-%d)"
          git pull --rebase
          git push
