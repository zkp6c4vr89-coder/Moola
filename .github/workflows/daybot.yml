name: daybot

# Two jobs per trading day (GitHub caps a job at 6 hours; the session is longer):
#   morning   09:35 ET -> waits for 09:45 ET, trades until 12:45 ET, flat at the handoff
#   afternoon 12:35 ET -> waits for 12:45 ET, trades until the close, then end-of-day bookkeeping
# Started on time by the Cloudflare Worker in scheduler/ (GitHub's own cron ran 9 hours late).
# dry_run=auto (what the scheduler sends) means: dry run until the repo variable DAYBOT_TRADE
# is "true" (Settings -> Secrets and variables -> Actions -> Variables).
on:
  workflow_dispatch:
    inputs:
      session:
        type: choice
        options: [morning, afternoon]
        default: afternoon
      dry_run:
        type: choice
        options: ["true", "false", "auto"]
        default: "true"

permissions:
  contents: write

concurrency:
  group: daybot          # the afternoon job queues behind the morning job, never overlaps
  cancel-in-progress: false

jobs:
  trade:
    runs-on: ubuntu-latest
    timeout-minutes: 340
    env:
      DAYBOT_ALPACA_API_KEY: ${{ secrets.DAYBOT_ALPACA_API_KEY }}
      DAYBOT_ALPACA_SECRET_KEY: ${{ secrets.DAYBOT_ALPACA_SECRET_KEY }}
      LIVE: "false"      # GitHub never trades real money
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -e ".[dev]"

      - name: Tests (no trading if anything is broken)
        run: pytest -q tests/test_daybot.py

      - name: Run session
        env:
          MANUAL_DRY_RUN: ${{ inputs.dry_run }}
          TRADE_ENABLED: ${{ vars.DAYBOT_TRADE }}
        run: |
          SESSION="${{ inputs.session }}"
          DRY="--dry-run"
          [ "$MANUAL_DRY_RUN" = "false" ] && DRY=""
          [ "$MANUAL_DRY_RUN" = "auto" ] && [ "$TRADE_ENABLED" = "true" ] && DRY=""
          echo "session=$SESSION dry_run=${DRY:-no}"
          python -m daybot.main run --session "$SESSION" $DRY

      - name: Commit logs and state
        if: always()
        run: |
          git config user.name "moola-bot"
          git config user.email "moola-bot@users.noreply.github.com"
          git add logs/daybot
          git diff --cached --quiet && exit 0
          git commit -m "daybot: $(date -u +%Y-%m-%d) session log"
          git pull --rebase
          git push
