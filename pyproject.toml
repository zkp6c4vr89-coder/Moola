[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "moola"
version = "0.1.0"
description = "Paper-trading bot whose strategy is reviewed and evolved by Claude Code"
requires-python = ">=3.11"
dependencies = [
    "alpaca-py>=0.30",
    "pandas>=2.1",
    "numpy>=1.26",
    "pyyaml>=6.0",
    "requests>=2.31",
    "vaderSentiment>=3.3.2",
    "matplotlib>=3.8",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
